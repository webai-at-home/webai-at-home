# Target model: LM Studio, serving google/gemma-4-e2b on this machine.
#
# This file is copied into the generated codex_home folder as lmstudio.config.toml, which is the
# name the Codex command-line program reads when it is given `--profile lmstudio`.

model = "google/gemma-4-e2b"
model_provider = "lmstudio_target_model"

[model_providers.lmstudio_target_model]
name = "LM Studio"
base_url = "http://localhost:1234/v1"
wire_api = "responses"
requires_openai_auth = false
