# Target model: Ollama, serving gemma4:e2b on this machine.
#
# This file is copied into the generated codex_home folder as ollama.config.toml, which is the name
# the Codex command-line program reads when it is given `--profile ollama`.

model = "gemma4:e2b"
model_provider = "ollama_target_model"

[model_providers.ollama_target_model]
name = "Ollama"
base_url = "http://localhost:11434/v1"
wire_api = "responses"
requires_openai_auth = false
