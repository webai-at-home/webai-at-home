# Target model: Ollama, serving gemma4:e2b on this machine.
# Used as `CODEX_HOME=<the generated codex_home folder> codex exec --profile ollama ...`.

model = "gemma4:e2b"
model_provider = "ollama_target_model"

[model_providers.ollama_target_model]
name = "Ollama"
base_url = "http://localhost:11434/v1"
wire_api = "responses"
requires_openai_auth = false
