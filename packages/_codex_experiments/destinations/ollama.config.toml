# Destination: Ollama, serving gemma4:e2b on this machine.
# Used as `CODEX_HOME=<this folder> codex exec --profile ollama ...`.

model = "gemma4:e2b"
model_provider = "ollama_destination"

[model_providers.ollama_destination]
name = "Ollama"
base_url = "http://localhost:11434/v1"
wire_api = "responses"
requires_openai_auth = false
