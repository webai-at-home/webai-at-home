<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WebAI every stage iframe debug</title>
    <link rel="stylesheet" href="/debug_iframe_all_stages/css/main.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-85Z9VG7BQP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-85Z9VG7BQP');
    </script>
</head>

<body>
    <iframe class="home-frame" src="/monitor" title="WebAI gateway monitor page"></iframe>

    <!-- No data-enabled-stages attribute is set, so this one worker browser frame offers every
         stage whose computation it implements: the development formula stages, all three
         Qwen3-0.6B shard stages, Chrome's built-in Gemma Nano language-model stage, the complete
         Qwen3.5-0.8B language-model stage, and the complete Llama 3.2 1B Instruct language-model
         stage. Offering the last two together means this one frame downloads both complete models
         — about 1.65 gigabytes combined — and holds both in graphics memory at once once each has
         run, so this page is a heavier way to exercise a worker browser than opening the two
         single-stage debug pages separately. The allow="language-model" permission is what
         lets the Gemma Nano stage run inside this frame at all; see debug_iframe_llm_gemma_nano_chrome_full/index.html.
         The allow="screen-wake-lock" permission is what lets this frame's worker page hold the
         screen wake lock instead of the browser refusing the request with a permissions policy
         violation. -->
    <div class="worker-column">
        <iframe allow="language-model; screen-wake-lock" data-worker-name="worker-all-stages"
            title="WebAI worker page offering every stage it can run"></iframe>
    </div>

    <script type="module" src="/_shared/debug_iframe_worker_frames.ts"></script>
</body>

</html>
