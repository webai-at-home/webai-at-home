<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WebAI Chrome built-in language-model iframe debug</title>
    <link rel="stylesheet" href="/debug_iframe_llm_gemma_nano_chrome_full/css/main.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-85Z9VG7BQP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-85Z9VG7BQP');
    </script>
</head>

<body>
    <iframe class="home-frame" src="/monitor" title="WebAI gateway monitor page"></iframe>

    <div class="worker-column">
        <!-- The browser only lets its own built-in language model be used by pages it has given
             that permission to, and a frame holding a page from a different address is not given
             it by default. This worker page is served from another port, so without allow the
             model reports itself unavailable inside the frame even though the browser has it. The
             screen-wake-lock permission is needed for the same reason, so the worker page can hold
             the screen wake lock instead of the browser refusing the request. -->
        <iframe allow="language-model; screen-wake-lock" data-worker-name="llm-gemma-nano-chrome-full"
            data-enabled-stages="stage_llm_gemma_nano_chrome_full"
            title="WebAI Chrome built-in language-model worker page"></iframe>
    </div>

    <script type="module" src="/_shared/debug_iframe_worker_frames.ts"></script>
</body>

</html>
